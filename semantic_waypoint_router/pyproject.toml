[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "public-map-generator"
version = "0.1.0"
description = "Generador de mapas previos de navegación a partir de datos públicos"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Luis Prieto López"}]
dependencies = [
  "geopandas>=0.14",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pillow>=10.0",
  "pydantic>=2.7",
  "pyproj>=3.6",
  "PyYAML>=6.0",
  "rasterio>=1.3.10",
  "requests>=2.31",
  "rich>=13.7",
  "scipy>=1.12",
  "shapely>=2.0",
  "typer>=0.12",
]

[project.optional-dependencies]
sentinel = [
  "planetary-computer>=1.0.0",
  "pystac-client>=0.8.2",
]
ui = [
  "folium>=0.17",
  "streamlit>=1.36",
  "streamlit-folium>=0.22",
]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10"]
all = [
  "planetary-computer>=1.0.0",
  "pystac-client>=0.8.2",
  "folium>=0.17",
  "streamlit>=1.36",
  "streamlit-folium>=0.22",
]

[project.scripts]
public-map-generator = "public_map_generator.cli:app"
pmg = "public_map_generator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/public_map_generator/cli.py" = ["B008"]
"src/public_map_generator/qgis.py" = ["E501"]
