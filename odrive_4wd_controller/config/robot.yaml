robot:
  # Physical 6.5-inch wheel gives 0.08255 m nominal radius. Measure under load.
  wheel_radius_m: REQUIRED_MEASUREMENT
  effective_wheel_radius_m: REQUIRED_MEASUREMENT
  track_width_m: REQUIRED_MEASUREMENT
  wheelbase_m: REQUIRED_MEASUREMENT
  mass_kg: REQUIRED_MEASUREMENT
  centre_of_mass: REQUIRED_MEASUREMENT
  wheel_type: "ZLTECH 6.5-inch hub motor tyre; tread REQUIRED_MEASUREMENT"
  tyres_deform_significantly: REQUIRED_MEASUREMENT
  gear_ratio: 1.0
  mechanical_efficiency: REQUIRED_DATASHEET_VALUE

control:
  update_rate_hz: 50.0
  odometry_rate_hz: 30.0
  diagnostics_rate_hz: 2.0
  command_timeout_s: 0.30
  idle_after_timeout_s: 1.0
  velocity_filter_enabled: true
  acceleration_limit_enabled: true

kinematics:
  type: skid_steer
  skid_steer_correction_factor: 1.0
  left_velocity_scale: 1.0
  right_velocity_scale: 1.0
  front_left_scale: 1.0
  rear_left_scale: 1.0
  front_right_scale: 1.0
  rear_right_scale: 1.0

safety:
  require_explicit_enable: true
  stop_on_axis_error: true
  stop_on_encoder_error: true
  stop_on_velocity_mismatch: true
  stop_on_usb_disconnect: true
  enter_idle_on_shutdown: true

odometry:
  publish_tf: true
  odom_frame: odom
  base_frame: base_link
  position_covariance: [0.05, 0.05, 999.0, 999.0, 999.0, 0.20]
  twist_covariance: [0.10, 0.10, 999.0, 999.0, 999.0, 0.30]
